name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # leak-check and gitleaks scan the full history

      - name: Lint (bash -n, python compile, JSON)
        run: bash scripts/lint.sh

      - name: Test suites (isolated HOME/ORCH_HOME, stub cmux)
        run: bash tests/run.sh

      - name: Leak check (personal identifiers, machine paths)
        run: bash scripts/leak-check.sh
        env:
          # On pull_request, HEAD is GitHub's synthetic test-merge (the opener's account identity,
          # never part of the repo's history): scan the PR head instead. Empty on push → HEAD.
          LEAK_REV: ${{ github.event.pull_request.head.sha }}

      - name: Install gitleaks (pinned version + checksum)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256_ARM64: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
          GITLEAKS_SHA256_X64: dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709
        run: |
          set -euo pipefail
          case "$(uname -m)" in arm64) arch=arm64; sum=$GITLEAKS_SHA256_ARM64 ;; *) arch=x64; sum=$GITLEAKS_SHA256_X64 ;; esac
          f="gitleaks_${GITLEAKS_VERSION}_darwin_${arch}.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$sum  $RUNNER_TEMP/$f" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: gitleaks (history)
        run: gitleaks git --no-banner --redact .

      - name: gitleaks (working tree)
        run: gitleaks dir --no-banner --redact .
